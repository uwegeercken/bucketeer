<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{keycheck.title}">Bucketeer – Key Check</title>
    <th:block th:replace="~{layout :: styles}"></th:block>
</head>
<body>

<nav th:replace="~{layout :: header}"></nav>

<main class="container-fluid px-4">

    <!-- Upload form -->
    <div class="panel" id="uploadPanel">
        <div class="panel-title" th:text="#{keycheck.upload.title}">Check keys from CSV file</div>
        <form id="checkForm" onsubmit="return startCheck(event)">
            <div class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small fw-semibold" th:text="#{label.bucket}">Bucket</label>
                    <select id="bucketInput" class="form-select form-select-sm font-monospace">
                        <option value="">--</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-semibold" th:text="#{keycheck.delimiter}">Delimiter</label>
                    <select id="delimiterInput" class="form-select form-select-sm">
                        <option value=",">Comma (,)</option>
                        <option value="semicolon">Semicolon (;)</option>
                        <option value="pipe">Pipe (|)</option>
                        <option value="tab">Tab</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <div class="form-check mt-4">
                        <input class="form-check-input" type="checkbox" id="hasHeaderInput">
                        <label class="form-check-label small" th:text="#{keycheck.hasHeader}" for="hasHeaderInput">CSV has header row</label>
                    </div>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-semibold" th:text="#{keycheck.file}">CSV file</label>
                    <input type="file" class="form-control form-control-sm" id="fileInput" accept=".csv,.txt,.tsv" required>
                </div>
                <div class="col-md-1">
                    <label class="form-label small fw-semibold" aria-hidden="true">&nbsp;</label>
                    <button type="submit" class="btn btn-sm btn-primary btn-icon" id="checkBtn"
                            th:title="#{keycheck.check}" title="Check"
                            th:aria-label="#{keycheck.check}" aria-label="Check">
                        <i class="bi bi-check2-circle"></i>
                    </button>
                </div>
            </div>
        </form>
        <div class="form-text mt-2" th:text="#{keycheck.file.hint}">Two columns per line: &lt;prefix&gt;, &lt;key&gt;.
            The prefix is a literal path or a prefix template, resolved like the search prefix; the key is appended to form the full object key.</div>
    </div>

    <!-- Progress -->
    <div class="panel" id="progressPanel" style="display:none;">
        <div class="d-flex align-items-center gap-2">
            <div class="spinner-border spinner-border-sm text-primary" id="progressSpinner"></div>
            <span id="progressText">Processing...</span>
            <button type="button" class="btn btn-sm btn-outline-danger ms-auto" id="cancelBtn"
                    onclick="cancelCheck()" th:text="#{btn.cancel}">Cancel</button>
        </div>
    </div>

    <!-- Error -->
    <div class="panel alert alert-danger mb-2" id="errorPanel" style="display:none;">
        <span id="errorText"></span>
    </div>

    <!-- Results -->
    <div class="panel" id="resultsPanel" style="display:none;">
        <div class="panel-title d-flex align-items-center justify-content-between">
            <span id="resultsTitle" th:text="#{keycheck.results}">Results</span>
            <div class="d-flex align-items-center gap-1">
                <div class="btn-group btn-group-sm" role="group" aria-label="Filter">
                    <button type="button" class="btn btn-outline-secondary active" id="filterAll"
                            onclick="setFilter('all')" th:text="#{keycheck.filter.all}">All</button>
                    <button type="button" class="btn btn-outline-secondary" id="filterExists"
                            onclick="setFilter('exists')" th:text="#{keycheck.filter.exists}">Existing</button>
                    <button type="button" class="btn btn-outline-secondary" id="filterMissing"
                            onclick="setFilter('missing')" th:text="#{keycheck.filter.missing}">Missing</button>
                    <button type="button" class="btn btn-outline-secondary" id="filterError"
                            onclick="setFilter('error')" th:text="#{keycheck.filter.error}">Errors</button>
                </div>
                <button type="button" class="btn btn-sm btn-outline-success btn-icon"
                        id="exportBtn" style="display:none;"
                        onclick="exportCsv()" th:title="#{keycheck.export}">
                    <i class="bi bi-download"></i>
                </button>
            </div>
        </div>
        <div id="summary" class="mb-2"></div>
        <div id="paginationTop" class="d-flex align-items-center gap-1 mb-2" style="display:none;"></div>
        <div id="resultsTable"></div>
        <div id="paginationBottom" class="d-flex align-items-center gap-1 mt-2" style="display:none;"></div>
    </div>

    <th:block th:replace="~{layout :: tagsModal}"></th:block>
    <th:block th:replace="~{layout :: deleteModal}"></th:block>
    <th:block th:replace="~{layout :: moveModal}"></th:block>
    <th:block th:replace="~{layout :: uploadModal}"></th:block>
    <th:block th:replace="~{layout :: rowContextMenu}"></th:block>

</main>

<footer th:replace="~{layout :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    const labelKeycheckTitle       = /*[[#{keycheck.title}]]*/ 'Key Check';
    const labelKeycheckResults     = /*[[#{keycheck.results}]]*/ 'Results';
    const labelKeycheckExists      = /*[[#{keycheck.exists}]]*/ 'Exists';
    const labelKeycheckMissing     = /*[[#{keycheck.missing}]]*/ 'Missing';
    const labelKeycheckProcessed   = /*[[#{keycheck.processed}]]*/ 'Processed';
    const labelKeycheckTotal       = /*[[#{keycheck.total}]]*/ 'Total';
    const labelKeycheckName        = /*[[#{label.objectName}]]*/ 'Name';
    const labelKeycheckSize        = /*[[#{label.size}]]*/ 'Size (KB)';
    const labelKeycheckLastModified = /*[[#{label.lastModified}]]*/ 'Last Modified';
    const labelKeycheckEtag        = /*[[#{keycheck.etag}]]*/ 'ETag';
    const labelKeycheckStatus      = /*[[#{keycheck.status}]]*/ 'Status';
    const labelKeycheckExport      = /*[[#{keycheck.export}]]*/ 'Export CSV';
    const labelKeycheckErrorCount  = /*[[#{keycheck.filter.error}]]*/ 'Errors';
    const labelKeycheckProgress    = /*[[#{keycheck.progress}]]*/ 'Processed {0} of {1} ({2}%)';
    const labelKeycheckCancelling  = /*[[#{keycheck.cancelling}]]*/ 'Cancelling...';
    const labelKeycheckCancelled   = /*[[#{keycheck.cancelled}]]*/ 'Check cancelled';
    const labelKeycheckNoResults   = /*[[#{keycheck.noResults}]]*/ 'No results.';
    const labelRowMenu             = /*[[#{btn.rowMenu}]]*/ 'Actions';
    const currentServer            = /*[[${selectedServer}]]*/ '';

    const SETTINGS_KEY = 'bucketeer_settings';
    const PAGE_SIZE = (() => {
        try {
            const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
            return s.pageSize && s.pageSize >= 10 && s.pageSize <= 1000 ? s.pageSize : 100;
        } catch { return 100; }
    })();

    let pollTimer = null;
    let currentPage = 0;
    let currentFilter = 'all';
    let currentBucket = '';

    function escHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    let lastBucketsLoad = 0;
    let refreshInFlight = false;

    async function loadBuckets() {
        try {
            const res = await fetch('/api/buckets');
            const buckets = await res.json();
            const select = document.getElementById('bucketInput');
            select.innerHTML = '<option value="">--</option>'
                + buckets.map(b => '<option value="' + escHtml(b) + '">' + escHtml(b) + '</option>').join('');
        } catch {} finally {
            lastBucketsLoad = Date.now();
        }
    }

    async function refreshBucketList() {
        if (refreshInFlight) return;
        const select = document.getElementById('bucketInput');
        if (Date.now() - lastBucketsLoad < 5000) return;
        const current = select.value;
        refreshInFlight = true;
        try {
            await loadBuckets();
            select.value = current;
        } finally {
            refreshInFlight = false;
        }
    }

    async function startCheck(e) {
        e.preventDefault();
        const file = document.getElementById('fileInput').files[0];
        const bucket = document.getElementById('bucketInput').value;
        const delimiter = document.getElementById('delimiterInput').value;
        const hasHeader = document.getElementById('hasHeaderInput').checked;

        if (!file || !bucket) return;

        const progressPanel = document.getElementById('progressPanel');
        const progressText = document.getElementById('progressText');
        const progressSpinner = document.getElementById('progressSpinner');
        const cancelBtn = document.getElementById('cancelBtn');
        const resultsPanel = document.getElementById('resultsPanel');
        const errorPanel = document.getElementById('errorPanel');
        const checkBtn = document.getElementById('checkBtn');

        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }

        progressPanel.style.display = 'block';
        resultsPanel.style.display = 'none';
        errorPanel.style.display = 'none';
        checkBtn.disabled = true;
        progressSpinner.style.display = '';
        cancelBtn.style.display = '';
        cancelBtn.disabled = false;
        progressText.textContent = escHtml(labelKeycheckProcessed) + '...';
        currentBucket = bucket;
        currentPage = 0;
        currentFilter = 'all';
        updateFilterButtons();

        const formData = new FormData();
        formData.append('file', file);
        formData.append('bucket', bucket);
        formData.append('delimiter', delimiter);
        formData.append('hasHeader', hasHeader);

        try {
            const res = await fetch('/api/keycheck/check', { method: 'POST', body: formData });
            const data = await res.json();

            if (data.error) {
                stopProgress();
                document.getElementById('errorText').textContent = escHtml(data.error);
                errorPanel.style.display = 'block';
                return;
            }
            pollStatus();
        } catch (err) {
            stopProgress();
            document.getElementById('errorText').textContent = 'Error: ' + escHtml(err.message);
            errorPanel.style.display = 'block';
        }
    }

    function stopProgress() {
        document.getElementById('progressPanel').style.display = 'none';
        document.getElementById('checkBtn').disabled = false;
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    async function cancelCheck() {
        document.getElementById('cancelBtn').disabled = true;
        try { await fetch('/api/keycheck/cancel', { method: 'POST' }); } catch {}
    }

    function pollStatus() {
        const tick = async () => {
            let s;
            try {
                const res = await fetch('/api/keycheck/status');
                s = await res.json();
            } catch { return; }

            updateProgress(s);
            if (s.status !== 'DONE' && s.status !== 'CANCELLED' && s.status !== 'ERROR') return;

            stopProgress();
            if (s.status === 'ERROR') {
                document.getElementById('errorText').textContent = 'Error: ' + escHtml(s.error || '');
                document.getElementById('errorPanel').style.display = 'block';
                return;
            }
            showSummary(s);
            loadResults();
        };
        tick();
        pollTimer = setInterval(tick, 500);
    }

    function updateProgress(s) {
        const total = s.total || 0;
        const processed = s.processed || 0;
        const pct = total > 0 ? Math.floor(processed * 100 / total) : 0;

        const cancelBtn = document.getElementById('cancelBtn');
        if (s.cancelling) {
            cancelBtn.disabled = true;
            document.getElementById('progressText').textContent = escHtml(labelKeycheckCancelling);
        } else {
            document.getElementById('progressText').textContent = labelKeycheckProgress
                .replace('{0}', processed).replace('{1}', total).replace('{2}', pct);
        }
    }

    function showSummary(s) {
        document.getElementById('summary').innerHTML =
            '<span class="badge bg-success me-1">' + escHtml(labelKeycheckExists) + ': ' + s.existCount + '</span>'
            + '<span class="badge bg-danger me-1">' + escHtml(labelKeycheckMissing) + ': ' + s.missingCount + '</span>'
            + '<span class="badge bg-warning text-dark me-1">' + escHtml(labelKeycheckErrorCount) + ': ' + s.errorCount + '</span>'
            + '<span class="text-muted small ms-2">'
            + (s.status === 'CANCELLED' ? escHtml(labelKeycheckCancelled) + ' \u2013 ' : '')
            + escHtml(labelKeycheckProcessed) + ': ' + s.processed + ' / ' + s.total + '</span>';
    }

    function setFilter(filter) {
        currentFilter = filter;
        currentPage = 0;
        updateFilterButtons();
        loadResults();
    }

    function updateFilterButtons() {
        const filterButtons = { all: 'filterAll', exists: 'filterExists', missing: 'filterMissing', error: 'filterError' };
        Object.keys(filterButtons).forEach(filter => {
            document.getElementById(filterButtons[filter]).classList.toggle('active', filter === currentFilter);
        });
    }

    async function loadResults() {
        const params = new URLSearchParams({ page: currentPage, pageSize: PAGE_SIZE, filter: currentFilter });
        let data;
        try {
            const res = await fetch('/api/keycheck/results?' + params.toString());
            data = await res.json();
        } catch (err) {
            document.getElementById('errorText').textContent = 'Error: ' + escHtml(err.message);
            document.getElementById('errorPanel').style.display = 'block';
            return;
        }
        document.getElementById('resultsPanel').style.display = 'block';
        document.getElementById('exportBtn').style.display = data.allTotal > 0 ? '' : 'none';
        renderRows(data);
        renderPager(data);
    }

    function renderRows(data) {
        const tableEl = document.getElementById('resultsTable');

        if (!data.rows || data.rows.length === 0) {
            tableEl.innerHTML = '<span class="text-muted small fst-italic">' + escHtml(labelKeycheckNoResults) + '</span>';
            return;
        }

        let html = '<table class="table table-sm table-bordered mb-1"><thead class="table-secondary"><tr>'
            + '<th>' + escHtml(labelKeycheckStatus) + '</th>'
            + '<th>' + escHtml(labelKeycheckName) + '</th>'
            + '<th class="text-end">' + escHtml(labelKeycheckSize) + '</th>'
            + '<th>' + escHtml(labelKeycheckLastModified) + '</th>'
            + '<th>' + escHtml(labelKeycheckEtag) + '</th>'
            + '<th style="width:44px"></th>'
            + '</tr></thead><tbody>';

        for (const r of data.rows) {
            const rowClass = r.error ? 'table-warning' : r.exists ? '' : 'table-danger';
            const statusIcon = r.error
                ? '<i class="bi bi-exclamation-triangle-fill text-warning" title="' + escHtml(r.error) + '"></i>'
                : r.exists
                    ? '<i class="bi bi-check-circle-fill text-success"></i>'
                    : '<i class="bi bi-x-circle-fill text-danger"></i>';
            const sizeKb = r.sizeBytes != null ? (r.sizeBytes / 1024).toFixed(2) : '';
            const menuCell = (r.exists && !r.error)
                ? '<button type="button" class="btn btn-sm btn-outline-secondary btn-icon row-menu-btn" title="' + escHtml(labelRowMenu) + '" aria-label="' + escHtml(labelRowMenu) + '" data-bucket="' + escHtml(currentBucket) + '" data-key="' + escHtml(r.key) + '"><i class="bi bi-three-dots" aria-hidden="true"></i></button>'
                : '';

            html += '<tr class="' + rowClass + '">'
                + '<td class="text-center">' + statusIcon + '</td>'
                + '<td class="text-break font-monospace small">' + escHtml(r.key) + '</td>'
                + '<td class="text-end small">' + sizeKb + '</td>'
                + '<td class="small">' + escHtml(formatBucketDateTime(r.lastModified)) + '</td>'
                + '<td class="small text-muted">' + escHtml(r.etag) + '</td>'
                + '<td class="text-center">' + menuCell + '</td>'
                + '</tr>';
        }

        html += '</tbody></table>';
        tableEl.innerHTML = html;
    }

    function renderPager(data) {
        const total = data.total || 0;
        const totalPages = Math.max(1, Math.ceil(total / (data.pageSize || PAGE_SIZE)));

        ['paginationTop', 'paginationBottom'].forEach(id => {
            const pag = document.getElementById(id);
            pag.innerHTML = '';
            pag.classList.toggle('d-flex', total > 0);
            pag.style.display = total > 0 ? '' : 'none';
            if (total === 0) return;

            const btn = (iconClass, disabled, onclick) => {
                const b = document.createElement('button');
                b.className = 'btn btn-sm btn-outline-secondary btn-icon';
                b.innerHTML = '<i class="bi ' + iconClass + '"></i>';
                b.disabled = disabled;
                if (!disabled) b.onclick = onclick;
                return b;
            };

            pag.appendChild(btn('bi-skip-start', currentPage === 0,
                () => { currentPage = 0; loadResults(); }));
            pag.appendChild(btn('bi-skip-backward', currentPage === 0,
                () => { currentPage--; loadResults(); }));

            const info = document.createElement('span');
            info.className = 'text-muted small px-2';
            info.textContent = (currentPage + 1) + ' / ' + totalPages + ' (' + total + ')';
            pag.appendChild(info);

            pag.appendChild(btn('bi-skip-forward', currentPage >= totalPages - 1,
                () => { currentPage++; loadResults(); }));
            pag.appendChild(btn('bi-skip-end', currentPage >= totalPages - 1,
                () => { currentPage = totalPages - 1; loadResults(); }));
        });
    }

    function exportCsv() {
        const delimiter = document.getElementById('delimiterInput').value;
        const hasHeader = document.getElementById('hasHeaderInput').checked;
        window.location.href = '/api/keycheck/export?delimiter=' + encodeURIComponent(delimiter) + '&hasHeader=' + hasHeader;
    }

    function rerunCheck() {
        const fileInput = document.getElementById('fileInput');
        const checkBtn = document.getElementById('checkBtn');
        if (!fileInput.files.length || checkBtn.disabled) return;
        startCheck(new Event('submit'));
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadBuckets();
        const bucketInput = document.getElementById('bucketInput');
        bucketInput.addEventListener('mousedown', refreshBucketList);
        bucketInput.addEventListener('focus', refreshBucketList);

        const tableContainer = document.getElementById('resultsTable');

        tableContainer.addEventListener('contextmenu', e => {
            const tr = e.target.closest('tr');
            if (!tr) return;
            e.preventDefault();
            const btn = tr.querySelector('.row-menu-btn');
            if (!btn) return;
            window.ObjectActions.openMenu(btn.dataset.bucket, btn.dataset.key, e.clientX, e.clientY, currentServer);
        });

        tableContainer.addEventListener('click', e => {
            const btn = e.target.closest('.row-menu-btn');
            if (!btn) return;
            const rect = btn.getBoundingClientRect();
            window.ObjectActions.openMenu(btn.dataset.bucket, btn.dataset.key, rect.left, rect.bottom + 2, currentServer);
        });

        window.addEventListener('bucketeer:objectDeleted', rerunCheck);
        window.addEventListener('bucketeer:objectMoved', rerunCheck);
    });
</script>
</body>
</html>
