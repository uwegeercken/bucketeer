<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{cart.title}">Bucketeer – Selection</title>
    <th:block th:replace="~{layout :: styles}"></th:block>
</head>
<body>

<nav th:replace="~{layout :: header}"></nav>

<main class="container-fluid px-4">

    <div class="panel">
        <div class="panel-title d-flex align-items-center justify-content-between">
            <span th:text="#{cart.title}">Selection</span>
            <div class="d-flex gap-1 align-items-center">
                <span id="renderStatus" class="text-muted small" style="display:none;"></span>
                <button type="button" class="btn btn-sm btn-outline-secondary btn-icon" id="btnMoveSelected"
                        disabled th:title="#{btn.moveSelected}" onclick="openCartMoveModal()">
                    <i class="bi bi-arrows-move"></i>
                </button>
                <button type="button" class="btn btn-sm btn-outline-danger btn-icon" id="btnDeleteSelected"
                        disabled th:title="#{btn.deleteSelected}" onclick="openCartDeleteModal()">
                    <i class="bi bi-trash"></i>
                </button>
                <button type="button" class="btn btn-sm btn-outline-secondary btn-icon" id="btnDownloadAll"
                        disabled th:title="#{cart.downloadAll}" onclick="downloadCart()">
                    <i class="bi bi-file-earmark-zip"></i>
                </button>
                <button type="button" class="btn btn-sm btn-outline-danger btn-icon"
                        onclick="clearCart()" th:title="#{cart.clear}"
                        th:disabled="${cartItems.isEmpty()}" id="btnClearCart">
                    <i class="bi bi-x-circle"></i>
                </button>
            </div>
        </div>

        <div th:if="${cartItems.isEmpty()}" class="text-muted small fst-italic" th:text="#{cart.empty}"></div>

        <div th:if="${!cartItems.isEmpty()}" class="mb-2">
            <span class="text-muted small" th:text="#{cart.itemCount(${cartItems.size()})}"></span>
            &mdash;
            <span class="text-muted small" th:text="#{cart.totalSize(${totalSize})}"></span>
        </div>

        <table th:if="${!cartItems.isEmpty()}" class="table table-sm table-hover table-bordered mb-0 results-table">
            <thead class="table-secondary">
            <tr>
                <th style="width:32px"><input type="checkbox" id="cartSelectAll"
                                              th:title="#{cart.selectAll}" onchange="toggleCartSelectAll(this.checked)"/></th>
                <th class="text-center" style="width:60px" th:text="#{cart.batch.no}">No.</th>
                <th th:text="#{cart.server}">Server</th>
                <th th:text="#{cart.bucket}">Bucket</th>
                <th th:text="#{snapshot.prefix}">Prefix</th>
                <th th:text="#{cart.batch.filters}">Filters</th>
                <th class="text-end" style="width:120px" th:text="#{cart.batch.objects}">Objects</th>
                <th class="text-end" style="width:120px" th:text="#{cart.batch.size}">Total size</th>
                <th style="width:52px"></th>
            </tr>
            </thead>
            <tbody id="cartTbody">
            </tbody>
        </table>
    </div>

    <!-- Batch Delete Modal -->
    <div class="modal fade" id="cartDeleteModal" tabindex="-1" aria-labelledby="cartDeleteModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header py-2">
                    <h6 class="modal-title fw-semibold" id="cartDeleteModalLabel" th:text="#{cart.modal.delete.title}">Delete selected objects</h6>
                    <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="modal"
                            aria-label="Close" th:aria-label="#{btn.close}"></button>
                </div>
                <div class="modal-body">
                    <div id="cartDeleteCount" class="small mb-2"></div>
                    <div id="cartDeleteError" class="alert alert-danger py-1 px-2 mb-2" style="display:none; font-size:0.82rem;"></div>
                    <div id="cartDeleteResult" class="alert alert-success py-1 px-2 mb-0" style="display:none; font-size:0.82rem;"></div>
                </div>
                <div class="modal-footer py-2">
                    <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal" th:text="#{btn.cancel}">Cancel</button>
                    <button type="button" class="btn btn-sm btn-danger" id="cartDeleteConfirmBtn" th:text="#{btn.delete}">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{layout :: moveModal}"></th:block>

</main>

<footer th:replace="~{layout :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    const labelConfirmClear = /*[[#{cart.confirm.clear}]]*/ 'Clear all items from selection?';
    const labelRemove         = /*[[#{cart.remove}]]*/ 'Remove from selection';
    const labelRenderProgress = /*[[#{cart.renderProgress}]]*/ 'Rendering {0} of {1} objects...';
    const labelBatchCount      = /*[[#{cart.batch.count}]]*/ '{0} objects';
    const labelBatchProgress   = /*[[#{cart.batch.progress}]]*/ 'Processed {0} of {1} objects...';
    const labelBatchDeleteResult = /*[[#{cart.batch.deleteResult}]]*/ 'Deleted: {0}, failed: {1}.';
    const labelBatchMixed        = /*[[#{cart.batch.mixed}]]*/ 'Selection must contain objects of a single server and bucket.';
    const labelOpError         = /*[[#{msg.opError}]]*/ 'Operation failed:';
    const labelFilterKey        = /*[[#{label.filterKey}]]*/ 'Name contains';
    const labelFilterSizeMin    = /*[[#{label.filterSizeMin}]]*/ 'Size min (KB)';
    const labelFilterSizeMax    = /*[[#{label.filterSizeMax}]]*/ 'Size max (KB)';
    const labelFilterDateFrom   = /*[[#{label.filterDateFrom}]]*/ 'Date from';
    const labelFilterDateTo     = /*[[#{label.filterDateTo}]]*/ 'Date to';

    let pendingCartDelete = null;
    let selectAllChecked  = false;
    let cartLoaded        = false;

    function removeItem(btn) {
        const id = btn.dataset.id;
        if (!id) return;
        fetch('/api/cart/remove', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: id })
        }).then(() => location.reload());
    }

    function clearCart() {
        if (!confirm(labelConfirmClear)) return;
        fetch('/api/cart/clear', { method: 'POST' })
            .then(() => location.reload());
    }

    function escHtml(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function formatTimestamp(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        if (isNaN(d.getTime())) return iso;
        const p = n => String(n).padStart(2, '0');
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
            + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    }

    function formatSizeBytes(bytes) {
        const n = Number(bytes) || 0;
        if (n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(2) + ' MB';
        return (n / 1024).toFixed(2) + ' KB';
    }

    function formatNumber(n) {
        return Number(n || 0).toLocaleString();
    }

    function cartRowHtml(item) {
        const checked = selectAllChecked ? ' checked' : '';
        const attrs = ' data-type="batch" data-id="' + escHtml(item.id) + '"'
            + ' data-server="' + escHtml(item.serverName) + '"'
            + ' data-bucket="' + escHtml(item.bucket) + '"';
        const keyCount = item.keyCount || 0;
        const objectCount = formatNumber(keyCount > 0 ? keyCount : item.count);
        return '<tr>'
            + '<td><input type="checkbox" class="cart-check"' + checked + attrs
            + ' onchange="updateCartActionButtons()"/></td>'
            + '<td class="font-monospace text-center">' + escHtml(item.seq) + '</td>'
            + '<td>' + escHtml(item.serverName) + '</td>'
            + '<td class="font-monospace">' + escHtml(item.bucket) + '</td>'
            + '<td class="font-monospace">' + escHtml(item.prefix || '\u2013') + '</td>'
            + '<td class="font-monospace">' + renderUsedFilters(item) + '</td>'
            + '<td class="text-end">' + objectCount + '</td>'
            + '<td class="text-end">' + formatSizeBytes(item.totalSizeBytes) + '</td>'
            + '<td><button type="button" class="btn btn-sm btn-outline-danger btn-icon"'
            + ' title="' + escHtml(labelRemove) + '" data-id="' + escHtml(item.id) + '"'
            + ' onclick="removeItem(this)"><i class="bi bi-x"></i></button></td>'
            + '</tr>';
    }

    function renderUsedFilters(item) {
        const parts = [];
        if (item.keyFilter)         parts.push(escHtml(labelFilterKey) + ': ' + escHtml(item.keyFilter));
        if (item.minSizeKb != null) parts.push(escHtml(labelFilterSizeMin) + ': ' + escHtml(String(item.minSizeKb)));
        if (item.maxSizeKb != null) parts.push(escHtml(labelFilterSizeMax) + ': ' + escHtml(String(item.maxSizeKb)));
        if (item.dateFrom)          parts.push(escHtml(labelFilterDateFrom) + ': ' + escHtml(item.dateFrom));
        if (item.dateTo)            parts.push(escHtml(labelFilterDateTo) + ': ' + escHtml(item.dateTo));
        return parts.length ? parts.join(' \u00b7 ') : '\u2013';
    }

    async function renderCartRows() {
        const tbody = document.getElementById('cartTbody');
        if (!tbody) return;
        const statusEl = document.getElementById('renderStatus');
        statusEl.style.display = '';
        let items;
        try {
            const res = await fetch('/api/cart');
            items = await res.json();
        } catch (e) {
            statusEl.textContent = labelOpError + ' ' + e.message;
            return;
        }
        const total = items.length;
        const CHUNK = 300;
        for (let i = 0; i < total; i += CHUNK) {
            const html = items.slice(i, i + CHUNK).map(cartRowHtml).join('');
            tbody.insertAdjacentHTML('beforeend', html);
            const done = Math.min(i + CHUNK, total);
            statusEl.textContent = labelRenderProgress.replace('{0}', done).replace('{1}', total);
            await new Promise(r => requestAnimationFrame(r));
        }
        statusEl.style.display = 'none';
        cartLoaded = true;
        updateCartActionButtons();
    }

    renderCartRows();

    function getSelectedCartItems() {
        return Array.from(document.querySelectorAll('.cart-check:checked')).map(cb => ({
            id:         cb.dataset.id,
            serverName: cb.dataset.server,
            bucket:     cb.dataset.bucket
        }));
    }

    function isMixedGroup(items) {
        const groups = new Set(items.map(i => i.serverName + '/' + i.bucket));
        return groups.size > 1;
    }

    function updateCartActionButtons() {
        const anyChecked = document.querySelectorAll('.cart-check:checked').length > 0;
        const enabled = cartLoaded && anyChecked;
        document.getElementById('btnMoveSelected').disabled = !enabled;
        document.getElementById('btnDeleteSelected').disabled = !enabled;
        document.getElementById('btnDownloadAll').disabled = !enabled;
    }

    function downloadCart() {
        const items = getSelectedCartItems();
        if (items.length === 0) return;
        if (isMixedGroup(items)) {
            const statusEl = document.getElementById('renderStatus');
            statusEl.textContent = labelBatchMixed;
            statusEl.style.display = '';
            setTimeout(() => { statusEl.style.display = 'none'; }, 3000);
            return;
        }
        window.location.href = '/cart/download-all?ids=' + items.map(i => encodeURIComponent(i.id)).join(',');
    }

    function toggleCartSelectAll(checked) {
        selectAllChecked = checked;
        document.querySelectorAll('.cart-check').forEach(cb => cb.checked = checked);
        updateCartActionButtons();
    }

    function openCartDeleteModal() {
        const items = getSelectedCartItems();
        if (items.length === 0) return;
        pendingCartDelete = items;
        document.getElementById('cartDeleteCount').textContent =
            labelBatchCount.replace('{0}', items.length);
        const errEl = document.getElementById('cartDeleteError');
        const resultEl = document.getElementById('cartDeleteResult');
        const confirmBtn = document.getElementById('cartDeleteConfirmBtn');
        errEl.style.display = 'none';
        resultEl.style.display = 'none';
        if (isMixedGroup(items)) {
            errEl.textContent = labelBatchMixed;
            errEl.style.display = 'block';
            confirmBtn.disabled = true;
        } else {
            confirmBtn.disabled = false;
        }
        new bootstrap.Modal(document.getElementById('cartDeleteModal')).show();
    }

    function pollBatch(jobId, onProgress, onDone, onError) {
        const timer = setInterval(async () => {
            try {
                const res = await fetch('/api/cart/batch/' + encodeURIComponent(jobId));
                const p = await res.json();
                if (p.found === false) {
                    clearInterval(timer);
                    onError('Job not found');
                    return;
                }
                onProgress(p.processed, p.total);
                if (p.done) {
                    clearInterval(timer);
                    onDone(p);
                }
            } catch (e) {
                clearInterval(timer);
                onError(e.message);
            }
        }, 400);
    }

    async function confirmCartDelete() {
        if (!pendingCartDelete) return;
        const btn = document.getElementById('cartDeleteConfirmBtn');
        btn.disabled = true;
        const errEl = document.getElementById('cartDeleteError');
        const resultEl = document.getElementById('cartDeleteResult');
        const countEl = document.getElementById('cartDeleteCount');
        try {
            const res = await fetch('/api/cart/delete-selected', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(pendingCartDelete)
            });
            const data = await res.json();
            if (!res.ok || !data.jobId) throw new Error(data.error || ('HTTP ' + res.status));
            countEl.textContent = labelBatchProgress.replace('{0}', 0).replace('{1}', data.total);
            pollBatch(data.jobId,
                (processed, total) => {
                    countEl.textContent = labelBatchProgress.replace('{0}', processed).replace('{1}', total);
                },
                (p) => {
                    if (p.error) {
                        errEl.textContent = labelOpError + ' ' + p.error;
                        errEl.style.display = 'block';
                        btn.disabled = false;
                        return;
                    }
                    const result = p.result;
                    if (result.failed > 0) {
                        const failedItem = result.items.find(i => i.error);
                        errEl.textContent = labelOpError + ' ' + (failedItem ? failedItem.error : '');
                        errEl.style.display = 'block';
                    }
                    resultEl.textContent = labelBatchDeleteResult
                        .replace('{0}', result.deleted).replace('{1}', result.failed);
                    resultEl.style.display = 'block';
                    setTimeout(() => location.reload(), 1500);
                },
                (msg) => {
                    errEl.textContent = labelOpError + ' ' + msg;
                    errEl.style.display = 'block';
                    btn.disabled = false;
                });
        } catch (e) {
            errEl.textContent = labelOpError + ' ' + e.message;
            errEl.style.display = 'block';
            btn.disabled = false;
        }
    }

    function openCartMoveModal() {
        const items = getSelectedCartItems();
        if (items.length === 0) return;
        MoveModal.open({
            title: /*[[#{cart.modal.move.title}]]*/ 'Move selected objects',
            items: items,
            endpoint: '/api/cart/move-selected',
            poll: true,
            makePayload: (toPrefix) => {
                return {
                    serverName: items[0].serverName,
                    bucket: items[0].bucket,
                    toPrefix: toPrefix,
                    keys: [],
                    queries: items.map(it => ({ id: it.id }))
                };
            },
            handleResponse: (data, errEl, resultEl, btn) => {
                if (data.failed > 0) {
                    const failedItem = data.items.find(i => i.status === 'FAILED');
                    resultEl.classList.add('alert-danger');
                    resultEl.textContent = moveModalLabels.opError + ' ' + (failedItem ? failedItem.error : '');
                } else {
                    resultEl.textContent = moveModalLabels.result
                        .replace('{0}', data.moved).replace('{1}', data.skipped)
                        .replace('{2}', data.failed);
                }
                resultEl.style.display = 'block';
                setTimeout(() => location.reload(), 1500);
                return data.failed === 0;
            }
        });
    }

    document.getElementById('cartDeleteConfirmBtn').addEventListener('click', confirmCartDelete);
    document.getElementById('cartDeleteModal').addEventListener('hidden.bs.modal', () => {
        pendingCartDelete = null;
    });
</script>
</body>
</html>
