<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<!--
  Shared layout fragments used by all pages.
  Usage:
    <link th:replace="~{layout :: styles}"/>
    <nav th:replace="~{layout :: header}"></nav>
    <footer th:replace="~{layout :: footer}"></footer>
-->

<!-- Styles fragment - include in <head> -->
<th:block th:fragment="styles">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/bucketeer.css}"/>
    <script th:inline="javascript">
        (function() {
            var saved = localStorage.getItem('bs-theme');
            if (saved === 'dark' || saved === 'light') {
                document.documentElement.setAttribute('data-bs-theme', saved);
            }
        })();
        function toggleTheme() {
            var current = document.documentElement.getAttribute('data-bs-theme');
            var next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-bs-theme', next);
            localStorage.setItem('bs-theme', next);
            updateThemeIcon(next);
        }
        function updateThemeIcon(theme) {
            var icon = document.getElementById('themeIcon');
            if (!icon) return;
            icon.className = theme === 'dark' ? 'bi bi-sun' : 'bi bi-moon-stars';
        }
        document.addEventListener('DOMContentLoaded', function() {
            var current = document.documentElement.getAttribute('data-bs-theme') || 'light';
            updateThemeIcon(current);
        });
    </script>
</th:block>

<!-- Header fragment -->
<nav th:fragment="header" class="navbar navbar-dark bg-dark mb-3 border-bottom border-secondary">
    <div class="container-fluid">
        <!-- Left: app name -->
        <a class="navbar-brand fw-bold" href="/" th:text="#{app.title}">Bucketeer</a>

        <!-- Center: server selector -->
        <form method="post" action="/session/server"
              class="d-flex align-items-center gap-2 mx-auto">
            <label class="text-secondary small" th:text="#{label.server}">Server</label>
            <select name="serverName" class="form-select form-select-sm w-auto"
                    onchange="sessionStorage.removeItem('bkt_bucket');sessionStorage.removeItem('bkt_prefix');sessionStorage.removeItem('bkt_key');this.form.submit()"
                    th:if="${serverNames != null and !serverNames.isEmpty()}">
                <option th:each="s : ${serverNames}"
                        th:value="${s}"
                        th:text="${s}"
                        th:selected="${s == selectedServer}">
                </option>
            </select>
            <span th:if="${serverNames == null or serverNames.isEmpty()}"
                  class="text-secondary small fst-italic"
                  th:text="#{header.noServers}">No servers configured</span>
        </form>

        <!-- Right: nav links -->
        <div class="d-flex gap-2">
            <a th:if="${backUrl != null}" th:href="${backUrl}"
               class="btn btn-sm btn-outline-light" th:title="#{nav.back}"><i class="bi bi-arrow-left"></i></a>
            <button class="btn btn-sm btn-outline-light" id="themeToggle"
                    th:title="#{label.themeToggle}" onclick="toggleTheme()">
                <i class="bi bi-moon-stars" id="themeIcon"></i>
            </button>
            <a class="btn btn-sm btn-outline-light" href="/cart"
               th:title="#{nav.cart}"><i class="bi bi-list-check"></i></a>
            <a class="btn btn-sm btn-outline-light" href="/keycheck"
               th:title="#{nav.keycheck}"><i class="bi bi-clipboard-check"></i></a>
            <button class="btn btn-sm btn-outline-light" id="toolsBtn"
                    th:title="#{nav.tools}" onclick="var m=new bootstrap.Modal(document.getElementById('toolsModal'));m.show();">
                <i class="bi bi-wrench"></i>
            </button>
            <button class="btn btn-sm btn-outline-light" id="snapshotsBtn"
                    th:title="#{nav.snapshots}" onclick="openSnapshotsModal();">
                <i class="bi bi-bookmarks"></i>
            </button>
            <a class="btn btn-sm btn-outline-light" href="/config"
               onclick="if(typeof saveFormState==='function') saveFormState()"
               th:title="#{nav.servers}"><i class="bi bi-server"></i></a>
            <a class="btn btn-sm btn-outline-light" href="/settings"
               onclick="if(typeof saveFormState==='function') saveFormState()"
               th:title="#{nav.config}"><i class="bi bi-gear"></i></a>
            <a class="btn btn-sm btn-outline-light" href="/help"
               onclick="if(typeof saveFormState==='function') saveFormState()"
               th:title="#{nav.help}"><i class="bi bi-question-circle"></i></a>
        </div>
    </div>
</nav>

<!-- Footer fragment -->
<footer th:fragment="footer" class="bg-dark text-secondary mt-4 py-2 border-top border-secondary">
    <div class="container-fluid px-4 d-flex justify-content-between align-items-center"
         style="font-size:0.75rem;">
        <a href="https://github.com/uwegeercken/bucketeer" target="_blank" rel="noopener"
           class="text-secondary text-decoration-none" th:text="#{footer.github}">Github</a>
        <span>
            <span th:text="#{footer.version}">Version</span>
            <span th:text="${appVersion}"></span>
            &nbsp;|&nbsp;
            <span th:text="#{footer.released}">Released</span>
            <span th:text="${appReleaseDate}"></span>
        </span>
    </div>

    <!-- Tools Modal -->
    <div class="modal fade" id="toolsModal" tabindex="-1" aria-labelledby="toolsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header py-2">
                    <h6 class="modal-title fw-semibold" id="toolsModalLabel" th:text="#{tools.panel.title}">Text Tools</h6>
                    <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold" th:text="#{tools.input}">Input</label>
                        <textarea id="toolsInput" class="form-control form-control-sm font-monospace" rows="4"
                                  placeholder="Paste or type text... (one value per line)"></textarea>
                    </div>

                    <div class="d-flex flex-wrap gap-1 mb-3">
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="toolsTransform('b64enc')"
                                th:text="#{tools.encode.base64}">Base64 Encode</button>
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="toolsTransform('b64dec')"
                                th:text="#{tools.decode.base64}">Base64 Decode</button>
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="toolsTransform('urlenc')"
                                th:text="#{tools.encode.url}">URL Encode</button>
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="toolsTransform('urldec')"
                                th:text="#{tools.decode.url}">URL Decode</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="toolsTransform('sha256')"
                                th:text="#{tools.hash.sha256}">SHA-256</button>
                    </div>

                    <div id="toolsError" class="alert alert-danger py-1 px-2 mb-2" style="display:none; font-size:0.82rem;"></div>

                    <div>
                        <label class="form-label small fw-semibold" th:text="#{tools.output}">Output</label>
                        <textarea id="toolsOutput" class="form-control form-control-sm font-monospace" rows="4" readonly></textarea>
                        <div class="d-flex align-items-center gap-2 mt-2">
                            <button type="button" class="btn btn-sm btn-outline-secondary"
                                    onclick="toolsCopyResult()">
                                <i class="bi bi-clipboard-check me-1"></i><span th:text="#{tools.copyResult}">Copy Result</span>
                            </button>
                            <span id="toolsCopied" class="text-success small" style="display:none;" th:text="#{tools.copied}">Copied!</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Snapshots Modal -->
    <div class="modal fade" id="snapshotsModal" tabindex="-1" aria-labelledby="snapshotsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header py-2">
                    <h6 class="modal-title fw-semibold" id="snapshotsModalLabel" th:text="#{snapshot.list}">Snapshots</h6>
                    <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="snapshotsModalBody">
                    <span class="text-muted small fst-italic" th:text="#{snapshot.empty}">No snapshots saved yet.</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Tools Modal Script -->
    <script th:inline="javascript">
        (function() {
            var msg = {
                errorDecode: /*[[#{tools.error.decode}]]*/ 'Invalid input',
                errorEmpty:  /*[[#{tools.error.empty}]]*/  'No input text'
            };

            window.toolsCopyResult = function() {
                var output = document.getElementById('toolsOutput').value;
                if (!output) return;
                navigator.clipboard.writeText(output).then(function() {
                    var el = document.getElementById('toolsCopied');
                    el.style.display = 'inline';
                    setTimeout(function() { el.style.display = 'none'; }, 1500);
                });
            };

            window.toolsTransform = function(action) {
                var input = document.getElementById('toolsInput').value;
                var errEl = document.getElementById('toolsError');
                errEl.style.display = 'none';

                if (!input) { errEl.textContent = msg.errorEmpty; errEl.style.display = 'block'; return; }

                try {
                    var lines = input.split('\n');
                    if (action === 'sha256') {
                        var promises = lines.map(function(line) {
                            var bytes = new TextEncoder().encode(line);
                            return crypto.subtle.digest('SHA-256', bytes).then(function(buf) {
                                return Array.from(new Uint8Array(buf)).map(function(b) { return b.toString(16).padStart(2,'0'); }).join('');
                            });
                        });
                        Promise.all(promises).then(function(results) {
                            document.getElementById('toolsOutput').value = results.join('\n');
                        });
                    } else {
                        var results = lines.map(function(line) {
                            switch (action) {
                                case 'b64enc': return btoa(unescape(encodeURIComponent(line)));
                                case 'b64dec': return decodeURIComponent(escape(atob(line)));
                                case 'urlenc': return encodeURIComponent(line);
                                case 'urldec': return decodeURIComponent(line);
                                default: return line;
                            }
                        });
                        document.getElementById('toolsOutput').value = results.join('\n');
                    }
                } catch(e) {
                    errEl.textContent = msg.errorDecode;
                    errEl.style.display = 'block';
                }
            };
        })();
    </script>

    <!-- Snapshots Modal Script -->
    <script th:inline="javascript">
        var snapLabels = {
            name:      /*[[#{snapshot.name}]]*/       'Name',
            server:    /*[[#{snapshot.server}]]*/     'Server',
            bucket:    /*[[#{snapshot.bucket}]]*/     'Bucket',
            prefix:    /*[[#{snapshot.prefix}]]*/     'Prefix',
            fileName:  /*[[#{snapshot.fileName}]]*/   'File',
            date:      /*[[#{snapshot.date}]]*/       'Saved',
            count:     /*[[#{snapshot.count}]]*/      'Objects',
            actions:   /*[[#{snapshot.actions}]]*/    'Actions',
            delete:    /*[[#{snapshot.delete}]]*/     'Delete snapshot',
            reveal:    /*[[#{snapshot.reveal}]]*/     'Open in file manager',
            confirm:   /*[[#{snapshot.confirm.delete}]]*/ 'Delete this snapshot?',
            empty:     /*[[#{snapshot.empty}]]*/      'No snapshots saved yet.'
        };

        function escHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        window.openSnapshotsModal = async function() {
            var body = document.getElementById('snapshotsModalBody');
            body.innerHTML = '<div class="spinner-border spinner-border-sm text-primary"></div>';
            var modal = new bootstrap.Modal(document.getElementById('snapshotsModal'));
            modal.show();

            try {
                var res = await fetch('/api/snapshots');
                var snapshots = await res.json();
                if (snapshots.length === 0) {
                    body.innerHTML = '<span class="text-muted small fst-italic">' + escHtml(snapLabels.empty) + '</span>';
                    return;
                }
                body.innerHTML = '<table class="table table-sm table-hover mb-1"><thead class="table-secondary"><tr>'
                    + '<th>' + escHtml(snapLabels.name) + '</th>'
                    + '<th>' + escHtml(snapLabels.server) + '</th>'
                    + '<th>' + escHtml(snapLabels.bucket) + '</th>'
                    + '<th>' + escHtml(snapLabels.prefix) + '</th>'
                    + '<th>' + escHtml(snapLabels.fileName) + '</th>'
                    + '<th>' + escHtml(snapLabels.date) + '</th>'
                    + '<th class="text-end">' + escHtml(snapLabels.count) + '</th>'
                    + '<th>' + escHtml(snapLabels.actions) + '</th>'
                    + '</tr></thead><tbody>'
                    + snapshots.map(function(s) {
                        return '<tr>'
                            + '<td class="small">' + escHtml(s.name) + '</td>'
                            + '<td class="small">' + escHtml(s.serverName) + '</td>'
                            + '<td class="small">' + escHtml(s.bucket) + '</td>'
                            + '<td class="small font-monospace">' + escHtml(s.prefix) + '</td>'
                            + '<td class="small font-monospace">' + escHtml(s.fileName) + '</td>'
                            + '<td class="small">' + new Date(s.createdAt).toLocaleString() + '</td>'
                            + '<td class="text-end small">' + s.rowCount + '</td>'
                            + '<td class="d-flex gap-1">'
                            + '<button class="btn btn-sm btn-outline-secondary btn-icon" title="' + escHtml(snapLabels.reveal) + '" onclick="snapReveal(\'' + s.id + '\')"><i class="bi bi-folder2-open"></i></button>'
                            + '<button class="btn btn-sm btn-outline-danger btn-icon" title="' + escHtml(snapLabels.delete) + '" onclick="snapDelete(\'' + s.id + '\')"><i class="bi bi-trash"></i></button>'
                            + '</td></tr>';
                    }).join('')
                    + '</tbody></table>';
            } catch {
                body.innerHTML = '<span class="text-muted small">Error loading snapshots</span>';
            }
        };

        async function snapDelete(id) {
            if (!confirm(snapLabels.confirm)) return;
            await fetch('/api/snapshots/' + id, { method: 'DELETE' });
            openSnapshotsModal();
        }

        async function snapReveal(id) {
            await fetch('/api/snapshots/' + id + '/reveal', { method: 'POST' });
        }
    </script>
</footer>
