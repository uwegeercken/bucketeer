<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{config.title}">Bucketeer – Configuration</title>
    <th:block th:replace="~{layout :: styles}"></th:block>
</head>
<body>

<nav th:replace="~{layout :: header}"></nav>

<main class="container-fluid px-4">

    <div th:if="${saved}" class="alert alert-success alert-dismissible fade show py-2"
         th:text="#{config.flash.saved(${saved})}">
        Server saved.
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${deleted}" class="alert alert-warning alert-dismissible fade show py-2"
         th:text="#{config.flash.deleted(${deleted})}">
        Server deleted.
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${testSuccess}" class="alert alert-success alert-dismissible fade show py-2"
         th:text="#{config.flash.testSuccess(${testSuccess})}">
        Connection test succeeded.
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${testError}" class="alert alert-danger alert-dismissible fade show py-2"
         th:text="#{config.flash.testError(${testName}, ${testError})}">
        Connection test failed.
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="panel">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="panel-title mb-0" th:text="#{config.servers}">S3 Servers</div>
            <a href="/config/server/new" class="btn btn-sm btn-primary btn-icon"
               th:title="#{config.addServer}" title="Add Server"
               th:aria-label="#{config.addServer}" aria-label="Add Server">
                <i class="bi bi-plus-lg"></i>
            </a>
        </div>

        <div th:if="${servers.isEmpty()}" class="text-muted small" th:text="#{config.noServers}"></div>

        <table th:if="${!servers.isEmpty()}" class="table table-sm table-hover table-bordered mb-0">
            <thead class="table-secondary">
            <tr>
                <th th:text="#{config.col.name}">Name</th>
                <th th:text="#{config.col.endpoint}">Endpoint</th>
                <th th:text="#{config.col.region}">Region</th>
                <th th:text="#{config.col.verifyCert}">Verify Cert</th>
                <th style="width:120px"></th>
            </tr>
            </thead>
            <tbody id="serverRows">
            <tr th:each="server : ${servers}" th:attr="data-name=${server.name()}">
                <td class="fw-semibold">
                    <i class="bi bi-grip-vertical text-muted drag-handle me-1"
                       th:title="#{config.action.dragToReorder}" title="Drag to reorder"></i>
                    <span th:text="${server.name()}"></span>
                </td>
                <td th:text="${server.endpoint()}" class="font-monospace small"></td>
                <td th:text="${server.region()}"></td>
                <td>
                    <span th:if="${server.verifyCertificate()}" th:text="#{common.yes}">Yes</span>
                    <span th:if="${!server.verifyCertificate()}" th:text="#{common.no}">No</span>
                </td>
                <td>
                    <div class="d-flex gap-1">
                        <a th:href="@{/config/server/{name}/edit(name=${server.name()})}"
                           class="btn btn-sm btn-outline-secondary btn-icon"
                           th:title="#{config.action.edit}" title="Edit"
                           th:aria-label="#{config.action.edit}" aria-label="Edit">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/config/server/{name}/delete(name=${server.name()})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm(labelConfirmDelete)">
                            <button type="submit" class="btn btn-sm btn-outline-danger btn-icon"
                                    th:title="#{config.action.delete}" title="Delete"
                                    th:aria-label="#{config.action.delete}" aria-label="Delete">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</main>

<footer th:replace="~{layout :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    const labelConfirmDelete = /*[[#{config.confirm.delete}]]*/ 'Delete this server?';

    // Drag-and-drop reordering. Dragging starts only from the grip icon so the
    // buttons and links in the row stay normally clickable.
    (function () {
        const tbody = document.getElementById('serverRows');
        if (!tbody) return;
        let dragged = null;
        let initialOrder = null;

        const currentOrder = () =>
            Array.from(tbody.querySelectorAll('tr[data-name]')).map(tr => tr.dataset.name);

        tbody.addEventListener('mousedown', e => {
            const handle = e.target.closest('.drag-handle');
            if (handle) handle.closest('tr').draggable = true;
        });
        tbody.addEventListener('mouseup', () => {
            tbody.querySelectorAll('tr[draggable="true"]').forEach(tr => tr.draggable = false);
        });

        tbody.addEventListener('dragstart', e => {
            dragged = e.target.closest('tr[data-name]');
            if (!dragged) return;
            initialOrder = currentOrder().join('\u0000');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', dragged.dataset.name);
            dragged.classList.add('opacity-50');
        });

        tbody.addEventListener('dragover', e => {
            if (!dragged) return;
            e.preventDefault();
            const target = e.target.closest('tr[data-name]');
            if (!target || target === dragged) return;
            const rect = target.getBoundingClientRect();
            const after = e.clientY > rect.top + rect.height / 2;
            tbody.insertBefore(dragged, after ? target.nextSibling : target);
        });

        tbody.addEventListener('drop', e => e.preventDefault());

        tbody.addEventListener('dragend', () => {
            if (!dragged) return;
            dragged.classList.remove('opacity-50');
            dragged.draggable = false;
            dragged = null;
            const order = currentOrder();
            if (order.join('\u0000') === initialOrder) return;
            fetch('/config/servers/reorder', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(order)
            }).finally(() => location.reload());   // show the persisted order (also restores it on error)
        });
    })();
</script>
<style>
    .drag-handle { cursor: grab; }
    .drag-handle:active { cursor: grabbing; }
</style>
<th:block th:replace="~{layout :: uploadModal}"></th:block>
</body>
</html>
