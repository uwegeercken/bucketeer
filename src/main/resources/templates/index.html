<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{app.title}">Bucketeer</title>
    <th:block th:replace="~{layout :: styles}"></th:block>
</head>
<body>

<nav th:replace="~{layout :: header}"></nav>

<main class="container-fluid px-4">

    <!-- Error -->
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show py-2" role="alert">
        <strong th:text="#{msg.error}">Fehler:</strong> <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Favorites / History combobox -->
    <div class="panel" id="favoritesPanel">
        <div class="panel-title" th:text="#{nav.favorites}">Favorites</div>
        <div class="fav-combobox-wrapper">
            <div class="d-flex gap-1">
                <input type="text" id="favComboInput" class="form-control form-control-sm fav-combo-input"
                       th:placeholder="#{placeholder.favoriteCombo}"
                       autocomplete="off"/>
                <button class="btn btn-sm btn-outline-secondary btn-icon" id="clearHistoryBtn"
                        th:title="#{btn.clearHistory}" style="display:none;"><i class="bi bi-trash3"></i></button>
            </div>
            <div id="favComboDropdown" class="fav-dropdown" style="display:none;"></div>
        </div>
    </div>

    <!-- Search -->
    <div class="panel" id="searchPanel">
        <div class="panel-title d-flex align-items-center justify-content-between">
            <span th:text="#{nav.search}">Search</span>
            <button class="btn btn-sm btn-outline-secondary btn-icon" id="addFavBtn"
                    th:title="#{btn.addFavorite}"><i class="bi bi-bookmark-plus"></i></button>
        </div>
        <form method="get" action="/" id="searchForm" class="pb-2" onsubmit="saveFormState();addToHistory();sessionStorage.removeItem('bkt_sort_by');sessionStorage.removeItem('bkt_sort_dir');sortBy='key';sortDir='asc';">
            <input type="hidden" name="search" value="true"/>
            <div class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small fw-semibold" th:text="#{label.bucket}">Bucket</label>
                    <select name="bucket" id="bucketInput"
                            class="form-select form-select-sm font-monospace">
                        <option value="">--</option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label class="form-label small fw-semibold">
                        <span th:text="#{label.prefix}">Prefix</span>
                        <i class="bi bi-code-slash text-muted small ms-1"
                           role="img" id="functionsIcon"
                           th:attr="data-bs-content=${tooltipText}"
                           data-bs-toggle="popover" data-bs-trigger="hover"
                           data-bs-placement="right" data-bs-html="true"></i>
                        <i class="bi bi-info-circle text-muted small ms-1"
                           role="img" id="resolvedIcon"
                           data-bs-toggle="popover" data-bs-trigger="hover"
                           data-bs-placement="right" data-bs-html="true"
                           data-bs-content=" "></i>
                    </label>
                    <div class="position-relative">
                        <input type="text" name="prefix" id="prefixInput"
                               class="form-control form-control-sm font-monospace"
                               th:value="${prefix}" oninput="updateResolvedPrefix()"/>
                        <div id="prefixError" class="text-danger small position-absolute start-0 end-0 px-1 py-1"
                             style="display:none; top:100%; z-index:10; background:inherit;"></div>
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-semibold" th:text="#{label.key}">Key</label>
                    <div class="d-flex gap-2 align-items-center">
                        <input type="text" name="key" id="keyInput"
                               class="form-control form-control-sm font-monospace"
                               th:value="${key}" oninput="updateResolvedPrefix()"/>
                        <button type="submit" id="searchBtn" class="btn btn-sm btn-outline-secondary btn-icon flex-shrink-0"
                                th:title="#{label.search}" th:aria-label="#{label.search}">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <!-- Results -->
    <div class="panel" id="resultsPanel" th:if="${queryStarted}">
            <div class="panel-title d-flex align-items-center justify-content-between">
            <span th:text="#{nav.results}">Results</span>
            <div class="d-flex gap-1 align-items-center">
                <span id="addAllStatus" class="text-muted small" style="display:none;"></span>
                <span id="cartBadge" class="badge bg-secondary" style="display:none;cursor:pointer;"
                      onclick="window.location.href='/cart'" title="Selection"></span>
                <button type="button" id="btnAddSelected" class="btn btn-sm btn-outline-secondary btn-icon"
                        onclick="addSelectedToCart()" th:title="#{cart.addSelected}" disabled>
                    <i class="bi bi-plus-square"></i>
                </button>
                <button type="button" id="btnAddAll" class="btn btn-sm btn-outline-secondary btn-icon"
                        onclick="addAllToCart()" th:title="#{cart.addAll}">
                    <i class="bi bi-check2-square"></i>
                </button>
                <button type="button" id="btnSaveSnapshot" class="btn btn-sm btn-outline-secondary btn-icon"
                        onclick="saveSnapshot()" th:title="#{snapshot.save}" disabled>
                    <i class="bi bi-bookmark-plus"></i>
                </button>
                <button type="button" id="toggleMaximize" class="btn btn-sm btn-outline-secondary btn-icon"
                        onclick="toggleMaximize()" th:title="#{btn.toggleMaximize}">
                    <i class="bi bi-arrows-fullscreen"></i>
                </button>
            </div>
        </div>

        <!-- Progress -->
        <div id="queryProgress" class="mb-2">
            <div class="d-flex align-items-center gap-2">
                <div class="spinner-border spinner-border-sm text-primary" id="querySpinner"></div>
                <span class="text-muted small" id="queryStatusText" th:text="#{msg.queryRunning}">Loading...</span>
                <span class="text-muted small" id="queryTimer" style="display:none;"></span>
            </div>
        </div>

        <!-- Filter form -->
        <div id="filterForm" class="mb-3" style="display:none;">
            <div class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label small fw-semibold" th:text="#{label.filterKey}">Name contains</label>
                    <div class="fav-combobox-wrapper">
                        <div class="d-flex gap-1">
                            <input type="text" id="filterKey" class="form-control form-control-sm font-monospace fav-combo-input"
                                   autocomplete="off" oninput="applyFilter()"/>
                            <button class="btn btn-sm btn-outline-secondary btn-icon" id="clearFilterHistoryBtn"
                                    th:title="#{btn.clearFilterHistory}" style="display:none;"><i class="bi bi-trash3"></i></button>
                        </div>
                        <div id="filterKeyDropdown" class="fav-dropdown" style="display:none;"></div>
                    </div>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold" th:text="#{label.filterSizeMin}">Size min (KB)</label>
                    <input type="number" id="filterSizeMin" class="form-control form-control-sm"
                           min="0" oninput="applyFilter()"/>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold" th:text="#{label.filterSizeMax}">Size max (KB)</label>
                    <input type="number" id="filterSizeMax" class="form-control form-control-sm"
                           min="0" oninput="applyFilter()"/>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold" th:text="#{label.filterDateFrom}">Date from</label>
                    <input type="date" id="filterDateFrom" class="form-control form-control-sm"
                           onchange="applyFilter()"/>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold" th:text="#{label.filterDateTo}">Date to</label>
                    <input type="date" id="filterDateTo" class="form-control form-control-sm"
                           onchange="applyFilter()"/>
                </div>
            </div>
        </div>

        <!-- Result count -->
        <div id="resultCount" style="display:none;" class="mb-2">
            <span class="text-muted small" id="resultCountText"></span>
        </div>

        <!-- Pagination top -->
        <div id="paginationTop" style="display:none;" class="d-flex align-items-center gap-1 mb-2"></div>

        <!-- Results table -->
        <table id="resultsTable" style="display:none;"
               class="table table-sm table-hover table-bordered mb-2 results-table">
            <thead class="table-secondary">
            <tr>
                <th style="width:40px;">
                    <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this.checked)"/>
                </th>
                <th style="cursor:pointer;" onclick="toggleSort('key')" id="th-key">
                    <span th:text="#{label.objectName}">Name</span> <i class="bi bi-arrow-down-up small text-muted"></i>
                </th>
                <th class="text-end" style="width:110px;cursor:pointer;" onclick="toggleSort('size_bytes')" id="th-size_bytes">
                    <span th:text="#{label.size}">Size (KB)</span> <i class="bi bi-arrow-down-up small text-muted"></i>
                </th>
                <th style="width:210px;cursor:pointer;" onclick="toggleSort('last_modified')" id="th-last_modified">
                    <span th:text="#{label.lastModified}">Last Modified</span> <i class="bi bi-arrow-down-up small text-muted"></i>
                </th>
                <th style="width:90px"></th>
            </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
        </table>

        <!-- Pagination bottom -->
        <div id="paginationBottom" style="display:none;" class="d-flex align-items-center gap-1"></div>
    </div>

    <!-- Add Favorite Modal -->
    <div class="modal fade" id="favModal" tabindex="-1" aria-labelledby="favModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header py-2">
                    <h6 class="modal-title fw-semibold" id="favModalLabel" th:text="#{modal.fav.title}">Save favorite</h6>
                    <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label small fw-semibold" for="favModalName" th:text="#{modal.fav.name}">Favorite name</label>
                    <input type="text" id="favModalName" class="form-control form-control-sm"/>
                </div>
                <div class="modal-footer py-2">
                    <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal" th:text="#{btn.cancel}">Cancel</button>
                    <button type="button" class="btn btn-sm btn-primary" id="favModalSaveBtn" th:text="#{btn.fav.save}">Save</button>
                </div>
            </div>
        </div>
    </div>

</main>

<footer th:replace="~{layout :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    const currentServer  = /*[[${selectedServer}]]*/ '';
    const currentBucket  = /*[[${bucket}]]*/ '';
    const queryStarted   = /*[[${queryStarted}]]*/ false;
    const labelDownload  = /*[[#{label.download}]]*/ 'Download';
    const labelNoFav     = /*[[#{msg.noFavorites}]]*/ 'No favorites yet.';
    const labelObjFound  = /*[[#{msg.objectsFound}]]*/ 'objects found...';
    const labelObjTotal  = /*[[#{msg.objectsTotal}]]*/ 'objects loaded.';
    const labelNoObj     = /*[[#{msg.noObjects}]]*/ 'No objects found.';
    const labelQryErr    = /*[[#{msg.queryError}]]*/ 'Error:';
    const labelObjMatch  = /*[[#{msg.objectsMatching}]]*/ 'objects matching filter';
    const labelPage      = /*[[#{msg.page}]]*/ 'page';
    const labelPrev      = /*[[#{btn.prev}]]*/ '\u2190 Previous';
    const labelNext      = /*[[#{btn.next}]]*/ 'Next \u2192';
    const labelSnapshotSave = /*[[#{snapshot.save}]]*/ 'Save snapshot';
    const labelNoCombo      = /*[[#{msg.noComboEntries}]]*/ 'No entries found';
    const labelClearHistoryConfirm = /*[[#{msg.clearHistoryConfirm}]]*/ 'Clear all search history?';
    const labelClearFilterHistoryConfirm = /*[[#{msg.clearFilterHistoryConfirm}]]*/ 'Clear all filter history?';

    const STORAGE_KEY  = 'bucketeer_favorites';
    const HISTORY_KEY  = 'bucketeer_history';
    const FILTER_HISTORY_KEY = 'bucketeer_filter_history';
    const SETTINGS_KEY = 'bucketeer_settings';

    function settingsValue(key, fallback) {
        try {
            const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
            return s[key] !== undefined && s[key] >= 0 && s[key] <= 500 ? s[key] : fallback;
        } catch { return fallback; }
    }

    const FILTER_HISTORY_MAX = settingsValue('filterHistoryMax', 20);
    const HISTORY_MAX  = settingsValue('historyMax', 50);

    // --- Bucket dropdown ---

    async function loadBuckets(selectPreselected) {
        const select = document.getElementById('bucketInput');
        try {
            const res = await fetch('/api/buckets');
            const buckets = await res.json();
            const current = selectPreselected || '';
            select.innerHTML = '<option value="">--</option>'
                + buckets.map(b => '<option value="' + escHtml(b) + '"'
                    + (b === current ? ' selected' : '') + '>'
                    + escHtml(b) + '</option>').join('');
        } catch {
            select.innerHTML = '<option value="">--</option>';
        }
    }

    // --- Prefix validation ---

    function setResolvedPopover(text) {
        const el = document.getElementById('resolvedIcon');
        const existing = bootstrap.Popover.getInstance(el);
        if (existing) existing.dispose();
        new bootstrap.Popover(el, {
            trigger: 'hover',
            placement: 'right',
            html: true,
            content: text || '\u2013'
        });
    }

    function updateResolvedPrefix() {
        const prefix    = document.getElementById('prefixInput').value;
        const key       = document.getElementById('keyInput').value;
        const errorEl   = document.getElementById('prefixError');
        const prefixEl  = document.getElementById('prefixInput');
        const searchBtn = document.getElementById('searchBtn');
        if (!prefix) {
            setResolvedPopover('');
            errorEl.style.display = 'none';
            prefixEl.classList.remove('is-invalid', 'is-valid');
            searchBtn.disabled = false;
            return;
        }
        fetch('/api/validate-prefix?prefix=' + encodeURIComponent(prefix))
            .then(r => r.json())
            .then(result => {
                if (result.valid) {
                    errorEl.style.display = 'none';
                    prefixEl.classList.remove('is-invalid');
                    prefixEl.classList.add('is-valid');
                    searchBtn.disabled = false;
                    const bucketVal = document.getElementById('bucketInput').value;
                    fetch('/api/resolve-prefix?prefix=' + encodeURIComponent(prefix) + '&key=' + encodeURIComponent(key) + '&bucket=' + encodeURIComponent(bucketVal))
                        .then(r => r.text())
                        .then(resolved => { setResolvedPopover(resolved); })
                        .catch(() => {});
                } else {
                    errorEl.textContent = result.error;
                    errorEl.style.display = 'block';
                    prefixEl.classList.add('is-invalid');
                    prefixEl.classList.remove('is-valid');
                    searchBtn.disabled = true;
                    setResolvedPopover('');
                }
            }).catch(() => {});
    }

    // --- Favorites & History ---

    function loadFavorites() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; }
    }
    function saveFavorites(list) { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }

    function loadHistory() {
        try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch { return []; }
    }
    function saveHistory(list) { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); }

    function addToHistory() {
        const combo = {
            server: currentServer || '',
            bucket: document.getElementById('bucketInput').value,
            prefix: document.getElementById('prefixInput').value,
            key:    document.getElementById('keyInput').value
        };
        if (!combo.bucket && !combo.prefix && !combo.key) return;
        let list = loadHistory();
        const idx = list.findIndex(e =>
            e.server === combo.server && e.bucket === combo.bucket &&
            e.prefix === combo.prefix && e.key === combo.key);
        if (idx >= 0) list.splice(idx, 1);
        list.unshift(combo);
        if (list.length > HISTORY_MAX) list.length = HISTORY_MAX;
        saveHistory(list);
        updateClearHistoryBtn();
    }

    function addFavorite() {
        const input = document.getElementById('favModalName');
        input.value = '';
        const modal = new bootstrap.Modal(document.getElementById('favModal'));
        modal.show();
        input.focus();
    }

    function saveFavoriteFromModal() {
        const name = document.getElementById('favModalName').value.trim();
        if (!name) return;
        const fav = { name: name.trim(), server: currentServer || '',
            bucket: document.getElementById('bucketInput').value,
            prefix: document.getElementById('prefixInput').value,
            key:    document.getElementById('keyInput').value };
        if (!fav.bucket && !fav.prefix && !fav.key) return;
        const list = loadFavorites();
        const idx  = list.findIndex(f => f.name === fav.name);
        if (idx >= 0) list[idx] = fav; else list.push(fav);
        saveFavorites(list);
        bootstrap.Modal.getInstance(document.getElementById('favModal')).hide();
        refreshComboDropdown();
    }

    function clearHistory() {
        if (!confirm(labelClearHistoryConfirm)) return;
        saveHistory([]);
        refreshComboDropdown();
        updateClearHistoryBtn();
    }

    function deleteHistoryEntry(server, bucket, prefix, key) {
        saveHistory(loadHistory().filter(e =>
            !(e.server === server && e.bucket === bucket && e.prefix === prefix && e.key === key)));
        refreshComboDropdown();
        updateClearHistoryBtn();
    }

    // --- Filter history (query result name filter) ---

    function loadFilterHistory() {
        try { return JSON.parse(localStorage.getItem(FILTER_HISTORY_KEY) || '[]'); } catch { return []; }
    }
    function saveFilterHistory(list) { localStorage.setItem(FILTER_HISTORY_KEY, JSON.stringify(list)); }

    function addFilterTerm(term) {
        term = (term || '').trim();
        if (!term) return;
        let list = loadFilterHistory();
        const idx = list.indexOf(term);
        if (idx >= 0) list.splice(idx, 1);
        list.unshift(term);
        if (list.length > FILTER_HISTORY_MAX) list.length = FILTER_HISTORY_MAX;
        saveFilterHistory(list);
        updateClearFilterHistoryBtn();
    }

    function clearFilterHistory() {
        if (!confirm(labelClearFilterHistoryConfirm)) return;
        saveFilterHistory([]);
        updateClearFilterHistoryBtn();
        closeFilterDropdown();
    }

    function updateClearFilterHistoryBtn() {
        const btn = document.getElementById('clearFilterHistoryBtn');
        if (!btn) return;
        btn.style.display = loadFilterHistory().length > 0 ? '' : 'none';
    }

    function renderFilterDropdown() {
        const dropdown = document.getElementById('filterKeyDropdown');
        if (!dropdown) return;
        const input = document.getElementById('filterKey');
        const terms = loadFilterHistory();
        const text = (input.value || '').trim().toLowerCase();
        const filtered = text ? terms.filter(t => t.toLowerCase().includes(text)) : terms;
        if (filtered.length === 0) {
            dropdown.innerHTML = '<div class="fav-dropdown-empty">' + escHtml(labelNoCombo) + '</div>';
        } else {
            dropdown.innerHTML = filtered.map(t =>
                '<div class="fav-dropdown-item" data-term="' + escHtml(t) + '">'
                + '<span class="fav-icon hist">&#8635;</span>'
                + '<span class="fav-label">' + escHtml(t) + '</span>'
                + '</div>').join('');
        }
        dropdown.style.display = 'block';
    }

    function closeFilterDropdown() {
        const dropdown = document.getElementById('filterKeyDropdown');
        if (dropdown) dropdown.style.display = 'none';
    }

    function selectFilterTerm(term) {
        document.getElementById('filterKey').value = term;
        addFilterTerm(term);
        closeFilterDropdown();
        applyFilter();
    }

    function updateClearHistoryBtn() {
        const btn = document.getElementById('clearHistoryBtn');
        if (!btn) return;
        btn.style.display = loadHistory().length > 0 ? '' : 'none';
    }

    function deleteFavorite(name) {
        saveFavorites(loadFavorites().filter(f => f.name !== name));
        refreshComboDropdown();
    }

    function applyFavorite(name) {
        const fav = loadFavorites().find(f => f.name === name);
        if (!fav) return;
        applyCombo(fav.server, fav.bucket, fav.prefix, fav.key);
    }

    function applyCombo(server, bucket, prefix, key) {
        const serverSelect = document.querySelector('select[name="serverName"]');
        const knownServers = serverSelect ? Array.from(serverSelect.options).map(o => o.value) : [];
        if (server && server !== currentServer && knownServers.includes(server)) {
            sessionStorage.removeItem('bkt_bucket');
            sessionStorage.removeItem('bkt_prefix');
            sessionStorage.removeItem('bkt_key');
            const form = document.createElement('form');
            form.method = 'POST'; form.action = '/session/server';
            const inp = document.createElement('input');
            inp.type = 'hidden'; inp.name = 'serverName'; inp.value = server;
            form.appendChild(inp); document.body.appendChild(form); form.submit();
            return;
        }
        sessionStorage.removeItem('bkt_bucket');
        sessionStorage.removeItem('bkt_prefix');
        sessionStorage.removeItem('bkt_key');
        const bucketEl = document.getElementById('bucketInput');
        if (bucket && !bucketEl.querySelector('option[value="' + CSS.escape(bucket) + '"]')) {
            const opt = document.createElement('option');
            opt.value = bucket; opt.textContent = bucket; opt.selected = true;
            bucketEl.appendChild(opt);
        } else {
            bucketEl.value = bucket || '';
        }
        document.getElementById('prefixInput').value = prefix || '';
        document.getElementById('keyInput').value    = key    || '';
        addToHistory();
        updateResolvedPrefix();
    }

    function getComboItems(filterText) {
        const favs = loadFavorites();
        const hist = loadHistory();
        const text = (filterText || '').toLowerCase();
        const seen = new Set();
        const items = [];
        for (const fav of favs) {
            const key = fav.server + '|' + fav.bucket + '|' + fav.prefix + '|' + fav.key;
            seen.add(key);
            const search = (fav.name + ' ' + fav.server + ' ' + fav.bucket + ' ' + fav.prefix + ' ' + fav.key).toLowerCase();
            if (!text || search.includes(text)) {
                items.push({ type: 'fav', name: fav.name, server: fav.server, bucket: fav.bucket, prefix: fav.prefix, key: fav.key });
            }
        }
        for (const h of hist) {
            const key = h.server + '|' + h.bucket + '|' + h.prefix + '|' + h.key;
            if (seen.has(key)) continue;
            seen.add(key);
            const search = (h.server + ' ' + h.bucket + ' ' + h.prefix + ' ' + h.key).toLowerCase();
            if (!text || search.includes(text)) {
                items.push({ type: 'hist', name: '', server: h.server, bucket: h.bucket, prefix: h.prefix, key: h.key });
            }
        }
        return items;
    }

    function formatComboDisplay(item) {
        const parts = [item.bucket, item.prefix, item.key].filter(Boolean);
        return parts.join(' / ') || '--';
    }

    function formatComboSub(item) {
        return item.server || '';
    }

    let comboHighlight = -1;

    function renderComboDropdown(filterText) {
        const dropdown = document.getElementById('favComboDropdown');
        const items = getComboItems(filterText);
        comboHighlight = -1;

        if (items.length === 0) {
            dropdown.innerHTML = '<div class="fav-dropdown-empty">' + escHtml(labelNoCombo) + '</div>';
            dropdown.style.display = 'block';
            return;
        }

        dropdown.innerHTML = items.map((item, i) => {
            const icon = item.type === 'fav' ? '&#9733;' : '&#8635;';
            const label = item.type === 'fav' ? escHtml(item.name) : escHtml(formatComboDisplay(item));
            const sub = escHtml(formatComboSub(item));
            const del = item.type === 'fav'
                ? '<span class="fav-del" data-favdel="' + escHtml(item.name) + '">&times;</span>'
                : item.type === 'hist'
                    ? '<span class="fav-del" data-histserver="' + escHtml(item.server) + '" data-histbucket="' + escHtml(item.bucket) + '" data-histprefix="' + escHtml(item.prefix) + '" data-histkey="' + escHtml(item.key) + '">&times;</span>'
                    : '';
            return '<div class="fav-dropdown-item" data-type="' + item.type
                + '" data-name="' + escHtml(item.name)
                + '" data-server="' + escHtml(item.server)
                + '" data-bucket="' + escHtml(item.bucket)
                + '" data-prefix="' + escHtml(item.prefix)
                + '" data-key="' + escHtml(item.key)
                + '"><span class="fav-icon' + (item.type === 'hist' ? ' hist' : '') + '">' + icon + '</span>'
                + '<span class="fav-label">' + label + '</span>'
                + (sub ? '<span class="fav-sub d-none d-md-inline">' + sub + '</span>' : '')
                + del + '</div>';
        }).join('');

        dropdown.style.display = 'block';
    }

    function refreshComboDropdown() {
        const input = document.getElementById('favComboInput');
        renderComboDropdown(input.value);
    }

    function closeComboDropdown() {
        document.getElementById('favComboDropdown').style.display = 'none';
        comboHighlight = -1;
    }

    function handleComboSelect(target) {
        const item = target.closest('.fav-dropdown-item');
        if (!item) return;
        const type   = item.dataset.type;
        const name   = item.dataset.name;
        const server = item.dataset.server;
        const bucket = item.dataset.bucket;
        const prefix = item.dataset.prefix;
        const key    = item.dataset.key;
        closeComboDropdown();
        document.getElementById('favComboInput').value = '';
        applyCombo(server, bucket, prefix, key);
    }

    function escHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function saveFormState() {
        sessionStorage.setItem('bkt_bucket', document.getElementById('bucketInput').value);
        sessionStorage.setItem('bkt_prefix', document.getElementById('prefixInput').value);
        sessionStorage.setItem('bkt_key',    document.getElementById('keyInput').value);
        sessionStorage.setItem('bkt_sort_by',  sortBy);
        sessionStorage.setItem('bkt_sort_dir', sortDir);
    }

    function restoreFormState() {
        const bucket = sessionStorage.getItem('bkt_bucket');
        const prefix = sessionStorage.getItem('bkt_prefix');
        const key    = sessionStorage.getItem('bkt_key');
        const savedSortBy  = sessionStorage.getItem('bkt_sort_by');
        const savedSortDir = sessionStorage.getItem('bkt_sort_dir');
        if (savedSortBy)  sortBy  = savedSortBy;
        if (savedSortDir) sortDir = savedSortDir;
        if (bucket) {
            const sel = document.getElementById('bucketInput');
            if (sel.querySelector('option[value="' + CSS.escape(bucket) + '"]')) {
                sel.value = bucket;
            } else if (bucket && sel.options.length > 0) {
                const opt = document.createElement('option');
                opt.value = bucket; opt.textContent = bucket; opt.selected = true;
                sel.appendChild(opt);
            }
        }
        if (prefix && !document.getElementById('prefixInput').value)
            document.getElementById('prefixInput').value = prefix;
        if (key && !document.getElementById('keyInput').value)
            document.getElementById('keyInput').value = key;
    }

    // --- Query polling ---

    let currentPage  = 0;
    let sortBy       = 'key';
    let sortDir      = 'asc';
    const PAGE_SIZE  = (() => {
        try {
            const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
            return s.pageSize && s.pageSize >= 10 && s.pageSize <= 1000 ? s.pageSize : 100;
        } catch { return 100; }
    })();
    let pollInterval = null;
    let queryStartTime = null;
    let queryTimerInterval = null;

    function formatElapsed(ms) {
        const sec = Math.floor(ms / 1000);
        if (sec <= 60) return sec + 's';
        const min = Math.floor(sec / 60);
        const rem = sec % 60;
        return min + 'm ' + rem + 's';
    }

    function startTimer() {
        queryStartTime = Date.now();
        const timerEl = document.getElementById('queryTimer');
        timerEl.style.display = '';
        timerEl.textContent = '0s';
        queryTimerInterval = setInterval(function() {
            timerEl.textContent = formatElapsed(Date.now() - queryStartTime);
        }, 1000);
    }

    function stopTimer() {
        clearInterval(queryTimerInterval);
        queryTimerInterval = null;
    }

    async function startPolling() {
        if (!queryStarted) return;
        startTimer();
        try {
            const res  = await fetch('/api/query/status');
            const data = await res.json();
            if (data.status === 'DONE' || data.status === 'ERROR') {
                handleQueryResult(data);
                return;
            }
        } catch (e) { /* ignore */ }
        pollInterval = setInterval(async () => {
            try {
                const res  = await fetch('/api/query/status');
                const data = await res.json();
                handleQueryResult(data);
            } catch (e) { /* ignore */ }
        }, 500);
    }

    function handleQueryResult(data) {
        const statusText = document.getElementById('queryStatusText');
        if (data.status === 'RUNNING') {
            statusText.textContent = data.objectsFound + ' ' + labelObjFound;
        } else if (data.status === 'DONE') {
            clearInterval(pollInterval);
            stopTimer();
            document.getElementById('querySpinner').style.display = 'none';
            if (data.objectsFound === 0) {
                statusText.textContent = labelNoObj;
            } else {
                statusText.textContent = data.objectsFound + ' ' + labelObjTotal;
                document.getElementById('filterForm').style.display = 'block';
                loadResults();
            }
        } else if (data.status === 'ERROR') {
            clearInterval(pollInterval);
            stopTimer();
            document.getElementById('querySpinner').style.display = 'none';
            statusText.classList.add('text-danger');
            statusText.textContent = labelQryErr + ' ' + data.error;
        }
    }

    let loadGen = 0;
    async function loadResults() {
        const gen = ++loadGen;
        const params = new URLSearchParams({ page: currentPage, pageSize: PAGE_SIZE, sortBy: sortBy, sortDir: sortDir });
        const keyFilter = document.getElementById('filterKey')?.value    || '';
        const minSizeKb = document.getElementById('filterSizeMin')?.value || '';
        const maxSizeKb = document.getElementById('filterSizeMax')?.value || '';
        const dateFrom  = document.getElementById('filterDateFrom')?.value || '';
        const dateTo    = document.getElementById('filterDateTo')?.value   || '';
        if (keyFilter)  params.append('keyFilter',  keyFilter);
        if (minSizeKb)  params.append('minSizeKb',  minSizeKb);
        if (maxSizeKb)  params.append('maxSizeKb',  maxSizeKb);
        if (dateFrom)   params.append('dateFrom',   dateFrom);
        if (dateTo)     params.append('dateTo',     dateTo);

        const res  = await fetch('/api/query/results?' + params.toString());
        const data = await res.json();
        if (gen !== loadGen) return;

        const rows = (data.rows || []);
        let total = typeof data.total === 'number' ? data.total : 0;

        // If the current page is beyond the result set, reset to page 0 and retry
        let totalPages = Math.ceil(total / PAGE_SIZE);
        if (currentPage >= totalPages && totalPages > 0) {
            currentPage = 0;
            loadResults();
            return;
        }

        // Correct pagination when the API returns an unfiltered total
        if (rows.length < PAGE_SIZE && rows.length > 0) {
            const corrected = currentPage * PAGE_SIZE + rows.length;
            if (corrected < total) {
                total = corrected;
                totalPages = Math.ceil(corrected / PAGE_SIZE);
            }
        }

        const tbody = document.getElementById('resultsBody');
        tbody.innerHTML = rows.map(row =>
            '<tr>'
            + '<td><input type="checkbox" class="row-check" data-key="' + escHtml(row.key) + '"'
            + ' data-bucket="' + escHtml(row.bucket) + '"'
            + ' data-sizebytes="' + row.sizeBytes + '"'
            + ' data-lastmodified="' + escHtml(row.lastModified) + '"'
            + ' onchange="updateAddSelectedBtn()"/></td>'
            + '<td class="text-break font-monospace small">' + escHtml(row.key) + '</td>'
            + '<td class="text-end small">' + escHtml(row.sizeKb) + '</td>'
            + '<td class="small">' + escHtml(row.lastModified) + '</td>'
            + '<td class="d-flex gap-1">'
            + '<a href="/download?bucket=' + encodeURIComponent(row.bucket || currentBucket) + '&key=' + encodeURIComponent(row.key) + '" class="btn btn-sm btn-outline-secondary btn-icon" title="' + escHtml(labelDownload) + '" aria-label="' + escHtml(labelDownload) + '"><i class="bi bi-download" aria-hidden="true"></i></a>'
            + '</td>'
            + '</tr>'
        ).join('');
        document.getElementById('selectAll').checked = false;

        document.getElementById('resultsTable').style.display = rows.length > 0 ? '' : 'none';

        const countEl = document.getElementById('resultCount');
        countEl.style.display = 'flex';
        document.getElementById('resultCountText').textContent = total + ' ' + labelObjMatch;
        document.getElementById('btnSaveSnapshot').disabled = total === 0;

        ['paginationTop', 'paginationBottom'].forEach(id => {
            const el = document.getElementById(id);
            el.classList.remove('d-flex');
            el.classList.add('d-none');
        });
        renderPagination('paginationTop',    total, totalPages);
        renderPagination('paginationBottom', total, totalPages);
        updateSortHeaders();
    }

    function renderPagination(elementId, total, totalPages) {
        const pag = document.getElementById(elementId);
        if (total <= PAGE_SIZE) { return; }
        pag.classList.remove('d-none');
        pag.classList.add('d-flex');
        pag.innerHTML = '';

        const btn = (iconClass, disabled, onclick) => {
            const b = document.createElement('button');
            b.className = 'btn btn-sm btn-outline-secondary btn-icon';
            b.innerHTML = '<i class="bi ' + iconClass + '"></i>';
            b.disabled = disabled;
            if (!disabled) b.onclick = onclick;
            return b;
        };

        pag.appendChild(btn('bi-skip-start', currentPage === 0,
            () => { clearTimeout(filterTimer); currentPage = 0; loadResults(); }));
        pag.appendChild(btn('bi-skip-backward', currentPage === 0,
            () => { clearTimeout(filterTimer); currentPage--; loadResults(); }));

        const info = document.createElement('span');
        info.className = 'text-muted small px-2';
        info.textContent = (currentPage + 1) + ' / ' + totalPages;
        pag.appendChild(info);

        pag.appendChild(btn('bi-skip-forward', currentPage >= totalPages - 1,
            () => { clearTimeout(filterTimer); currentPage++; loadResults(); }));
        pag.appendChild(btn('bi-skip-end', currentPage >= totalPages - 1,
            () => { clearTimeout(filterTimer); currentPage = totalPages - 1; loadResults(); }));
    }

    let maximized = false;
    function toggleMaximize() {
        maximized = !maximized;
        const fav    = document.getElementById('favoritesPanel');
        const search = document.getElementById('searchPanel');
        const icon   = document.querySelector('#toggleMaximize i');
        if (maximized) {
            fav.style.display = 'none';
            search.style.display = 'none';
            icon.className = 'bi bi-fullscreen-exit';
        } else {
            fav.style.display = '';
            search.style.display = '';
            icon.className = 'bi bi-arrows-fullscreen';
        }
    }

    let filterTimer = null;
    function applyFilter() {
        currentPage = 0;
        clearTimeout(filterTimer);
        ['paginationTop', 'paginationBottom'].forEach(id => {
            const el = document.getElementById(id);
            if (el) { el.classList.remove('d-flex'); el.classList.add('d-none'); el.innerHTML = ''; }
        });
        filterTimer = setTimeout(loadResults, 300);
    }

    function toggleSort(column) {
        if (sortBy === column) {
            sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        } else {
            sortBy = column;
            sortDir = 'asc';
        }
        currentPage = 0;
        updateSortHeaders();
        loadResults();
    }

    function updateSortHeaders() {
        ['key', 'size_bytes', 'last_modified'].forEach(col => {
            const th = document.getElementById('th-' + col);
            if (!th) return;
            const icon = th.querySelector('i');
            if (col === sortBy) {
                icon.className = sortDir === 'asc'
                    ? 'bi bi-arrow-up text-primary'
                    : 'bi bi-arrow-down text-primary';
            } else {
                icon.className = 'bi bi-arrow-down-up small text-muted';
            }
        });
    }

    // --- Cart ---

    function toggleSelectAll(checked) {
        document.querySelectorAll('.row-check').forEach(cb => cb.checked = checked);
        updateAddSelectedBtn();
    }

    function updateAddSelectedBtn() {
        const anyChecked = document.querySelectorAll('.row-check:checked').length > 0;
        document.getElementById('btnAddSelected').disabled = !anyChecked;
    }

    function getSelectedItems() {
        return Array.from(document.querySelectorAll('.row-check:checked')).map(cb => ({
            serverName:   currentServer,
            bucket:       cb.dataset.bucket || currentBucket,
            key:          cb.dataset.key,
            sizeBytes:    parseInt(cb.dataset.sizebytes, 10),
            lastModified: cb.dataset.lastmodified ? new Date(cb.dataset.lastmodified).toISOString() : null
        }));
    }

    async function addToCart(items) {
        const res = await fetch('/api/cart/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(items)
        });
        const data = await res.json();
        updateCartBadge(data.count);
    }

    function addSelectedToCart() {
        const items = getSelectedItems();
        if (items.length === 0) return;
        addToCart(items);
        document.querySelectorAll('.row-check').forEach(cb => cb.checked = false);
        document.getElementById('selectAll').checked = false;
        updateAddSelectedBtn();
    }

    async function addAllToCart() {
        const btn = document.getElementById('btnAddAll');
        const origHtml = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
        const statusEl = document.getElementById('addAllStatus');
        statusEl.style.display = '';
        let allItems = [];
        let page = 0;
        const pageSize = PAGE_SIZE;
        try {
            while (true) {
                statusEl.textContent = 'Loading page ' + (page + 1) + '...';
                const params = new URLSearchParams({ page: page, pageSize: pageSize, sortBy: sortBy, sortDir: sortDir });
                const keyFilter = document.getElementById('filterKey')?.value || '';
                const minSizeKb = document.getElementById('filterSizeMin')?.value || '';
                const maxSizeKb = document.getElementById('filterSizeMax')?.value || '';
                const dateFrom = document.getElementById('filterDateFrom')?.value || '';
                const dateTo = document.getElementById('filterDateTo')?.value || '';
                if (keyFilter) params.append('keyFilter', keyFilter);
                if (minSizeKb) params.append('minSizeKb', minSizeKb);
                if (maxSizeKb) params.append('maxSizeKb', maxSizeKb);
                if (dateFrom) params.append('dateFrom', dateFrom);
                if (dateTo) params.append('dateTo', dateTo);
                const res = await fetch('/api/query/results?' + params.toString());
                const data = await res.json();
                for (const row of data.rows) {
                    allItems.push({
                        serverName:   currentServer,
                        bucket:       row.bucket || currentBucket,
                        key:          row.key,
                        sizeBytes:    row.sizeBytes,
                        lastModified: row.lastModified ? new Date(row.lastModified).toISOString() : null
                    });
                }
                if (!data.hasMore) break;
                page++;
            }
            statusEl.textContent = 'Adding ' + allItems.length + ' objects...';
            if (allItems.length > 0) await addToCart(allItems);
        } finally {
            statusEl.style.display = 'none';
            btn.disabled = false;
            btn.innerHTML = origHtml;
        }
    }

    async function updateCartBadge(count) {
        if (count === undefined) {
            try {
                const res = await fetch('/api/cart/count');
                const data = await res.json();
                count = data.count;
            } catch { count = 0; }
        }
        const badge = document.getElementById('cartBadge');
        if (count > 0) {
            badge.textContent = count;
            badge.style.display = 'inline';
        } else {
            badge.style.display = 'none';
        }
    }

    // --- Snapshots ---

    async function saveSnapshot() {
        const res = await fetch('/api/snapshots', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({})
        });
        const data = await res.json();
        if (res.ok) {
            window.location.href = '/snapshots';
        } else {
            alert(data.error || 'Failed to save snapshot');
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('[data-bs-toggle="popover"]').forEach(el => {
            new bootstrap.Popover(el);
        });
        setResolvedPopover('');

        loadBuckets(currentBucket).then(() => {
            restoreFormState();
            updateResolvedPrefix();
            startPolling();
            updateCartBadge();
        });

        // Combobox logic
        const comboInput = document.getElementById('favComboInput');
        const dropdown   = document.getElementById('favComboDropdown');

        comboInput.addEventListener('focus', () => {
            renderComboDropdown(comboInput.value);
        });

        comboInput.addEventListener('input', () => {
            renderComboDropdown(comboInput.value);
        });

        comboInput.addEventListener('blur', () => {
            setTimeout(closeComboDropdown, 200);
        });

        comboInput.addEventListener('keydown', e => {
            const items = dropdown.querySelectorAll('.fav-dropdown-item');
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                comboHighlight = Math.min(comboHighlight + 1, items.length - 1);
                items.forEach((el, i) => el.classList.toggle('active', i === comboHighlight));
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                comboHighlight = Math.max(comboHighlight - 1, -1);
                items.forEach((el, i) => el.classList.toggle('active', i === comboHighlight));
            } else if (e.key === 'Enter' && comboHighlight >= 0 && items[comboHighlight]) {
                e.preventDefault();
                handleComboSelect(items[comboHighlight]);
            } else if (e.key === 'Escape') {
                closeComboDropdown();
            }
        });

        dropdown.addEventListener('mousedown', e => {
            const delEl = e.target.closest('.fav-del');
            if (delEl) {
                e.stopPropagation();
                if (delEl.dataset.favdel) deleteFavorite(delEl.dataset.favdel);
                else if (delEl.dataset.histserver !== undefined) deleteHistoryEntry(
                    delEl.dataset.histserver, delEl.dataset.histbucket,
                    delEl.dataset.histprefix, delEl.dataset.histkey);
                return;
            }
            handleComboSelect(e.target);
        });

        document.getElementById('addFavBtn').addEventListener('click', addFavorite);
        document.getElementById('clearHistoryBtn').addEventListener('click', clearHistory);
        updateClearHistoryBtn();

        const filterKey = document.getElementById('filterKey');
        const filterDropdown = document.getElementById('filterKeyDropdown');
        if (filterKey && filterDropdown) {
            filterKey.addEventListener('focus', renderFilterDropdown);
            filterKey.addEventListener('input', renderFilterDropdown);
            filterKey.addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addFilterTerm(filterKey.value);
                    closeFilterDropdown();
                    applyFilter();
                } else if (e.key === 'Escape') {
                    closeFilterDropdown();
                }
            });
            filterKey.addEventListener('blur', () => {
                addFilterTerm(filterKey.value);
                setTimeout(closeFilterDropdown, 150);
            });
            filterDropdown.addEventListener('mousedown', e => {
                const item = e.target.closest('.fav-dropdown-item');
                if (item) selectFilterTerm(item.dataset.term);
            });
            document.getElementById('clearFilterHistoryBtn').addEventListener('click', clearFilterHistory);
            updateClearFilterHistoryBtn();
        }

        document.getElementById('favModalSaveBtn').addEventListener('click', saveFavoriteFromModal);
        document.getElementById('favModalName').addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                saveFavoriteFromModal();
            }
        });
    });
</script>
