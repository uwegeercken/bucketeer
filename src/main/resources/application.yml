spring:
  application:
    name: bucketeer
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths: /css/**, /js/**

server:
  port: 8444

bucketeer:
  version: "0.8.4"
  release-date: "2026-10-04"
  api-token: ""
  query:
    parallelism: 4
  duckdb:
    quack:
      # Enabled/disabled via the Settings modal (stored in ~/.bucketeer/settings.json).
      port: 9494
      token: ""
  scan:
    max-prefixes: 200
    max-depth: 10